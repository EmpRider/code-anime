<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Anime · Flow player</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/player.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">CODE ANIME / LOCAL FLOW PLAYER</p>
        <h1 id="title">Loading flow…</h1>
        <p>
          Explore an agent-authored simulation. Values are mock data, not a live
          execution trace.
        </p>
      </header>
      <section class="toolbar" aria-label="Playback controls">
        <button id="previous">Previous</button><button id="play">Play</button
        ><button id="next">Next</button><button id="restart">Restart</button
        ><label
          >Speed
          <select id="speed">
            <option value="1600">Slow</option>
            <option value="900" selected>Normal</option>
            <option value="450">Fast</option>
          </select></label
        ><label class="timeline"
          >Step
          <input id="timeline" type="range" min="0" max="0" value="0" /></label
        ><output id="progress">0 / 0</output>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="canvas" aria-label="Flow modules"></section>
      <section class="inspector">
        <h2 id="packet-title">Select a step</h2>
        <p id="route"></p>
        <pre id="fields">{}</pre>
      </section>
    </main>
  </body>
</html>
